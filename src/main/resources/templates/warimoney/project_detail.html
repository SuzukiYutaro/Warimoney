<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>プロジェクト詳細</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/project_detail.css}">
</head>

<body th:attr="data-project-id=${project.id}">

	<div class="page">
		<div class="header">
			<div class="left-space">
				<a th:href="@{/projects}" class="back-btn">
					←
				</a>

				<div class="title">
					<div class="page-title">PROJECT</div>
					<div class="page-subtitle">プロジェクト詳細</div>
				</div>
			</div>

			<div class="logo">
				<img src="/img/warimoney_logo.png" alt="logo">
			</div>
		</div>

		<div class="project-board">

			<div class="project-header">
				<div class="project-name" th:text="${project.projectName}">
				</div>
			</div>

			<div class="content-grid">

				<section class="panel expenses-panel">

					<div class="panel-title">
						<h2>EXPENSES</h2>
						<span>立替記録</span>
						<button class="small-add-btn" data-bs-toggle="modal" data-bs-target="#addExpenseModal">
							＋
						</button>
					</div>

					<div class="expense-list">

						<div class="expense-item" th:each="e : ${project.expenses}">

							<div class="expense-meta">

								<span th:text="'支払者：' + ${e.payer.memberName}">
								</span>

								<span th:text="'記録日' + ${#temporals.format(e.createdAt,'yyyy/MM/dd')}">
								</span>

							</div>
							<span class="expense-top">

								<span class="amount" th:text="${#numbers.formatInteger(e.amount,0)} + '円'">
								</span>
								<span class="expense-desc" th:text="${e.description}">
								</span>

								<button class="edit-mini-btn" data-bs-toggle="modal" data-bs-target="#editExpenseModal"
									th:attr="
                                    data-id=${e.id},
                                    data-amount=${e.amount},
                                    data-desc=${e.description},
                                    data-payer=${e.payer.id}">
									編集
								</button>
							</span>
						</div>

					</div>
				</section>

				<!-- Data -->
				<section class="panel data-panel">

					<div class="panel-title">
						<h2>DATA</h2>
						<span>立替状況</span>
					</div>

					<canvas id="paidChart"></canvas>

				</section>

				<section class="panel members-panel">

					<div class="panel-title">
						<h2>MEMBER</h2>
						<span>参加者</span>
					</div>

					<ul class="member-list">

						<li th:each="m : ${project.members}">

							<span th:text="${m.memberName}">
							</span>

							<button class="member-edit-btn" data-bs-toggle="modal" data-bs-target="#editMemberModal"
								th:attr="
				                                data-id=${m.id},
				                                data-name=${m.memberName}">
								編集
							</button>

						</li>

					</ul>

					<button class="member-add-btn" data-bs-toggle="modal" data-bs-target="#addMemberModal">
						＋
					</button>

				</section>

			</div>
			<div class="settlement-area">

				<a th:href="@{'/projects/' + ${project.id} + '/settlement'}" class="settlement-btn">

					SETTLEMENT 清算

				</a>

			</div>

		</div>

	</div>

	</div>

	<script th:inline="javascript">
		const paidLabels = /*[[${paidMap.keySet()}]]*/[];
		const paidValues = /*[[${paidMap.values()}]]*/[];
	</script>

	<div th:replace="warimoney/fragments/modals :: addMemberModal"></div>
	<div th:replace="warimoney/fragments/modals :: editMemberModal"></div>
	<div th:replace="warimoney/fragments/modals :: addExpenseModal"></div>
	<div th:replace="warimoney/fragments/modals :: editExpenseModal"></div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
	<script th:src="@{/js/project_detail.js}"></script>
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	<script th:src="@{/js/project_chart.js}"></script>

</body>



</html>
