<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>プロジェクト詳細</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-4" th:attr="data-project-id=${project.id}">
	<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>


	<h1 th:text="${project.projectName} + ' の詳細'"></h1>

	<hr>

	<!-- プロジェクト基本情報 -->
	<h3>プロジェクト情報</h3>
	<table class="table table-bordered">
		<tr>
			<th>作成日</th>
			<td th:text="${#temporals.format(project.createdAt, 'yyyy/MM/dd HH:mm')}"></td>
		</tr>
		<tr>
			<th>更新日</th>
			<td th:text="${#temporals.format(project.updatedAt, 'yyyy/MM/dd HH:mm')}"></td>
		</tr>
	</table>

	<hr>

	<!-- メンバー一覧 -->
	<h3>メンバー一覧</h3>
	<button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#addMemberModal">
		メンバー追加
	</button>


	<table class="table table-striped">
		<thead>
			<tr>
				<th>メンバー名</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="m : ${project.members}">
				<td th:text="${m.memberName}"></td>
				<td>
					<button class="btn btn-sm btn-warning" data-bs-toggle="modal" data-bs-target="#editMemberModal"
						th:attr="data-id=${m.id}, data-name=${m.memberName}">
						編集
					</button>
				</td>
			</tr>

		</tbody>
	</table>



	<hr>

	<!--支払い一覧-->
	<h3>支払い一覧</h3>
	<button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#addExpenseModal">
		支払い追加
	</button>


	<table class="table table-striped">
		<thead>
			<tr>
				<th>支払者</th>
				<th>金額</th>
				<th>説明</th>
				<th>記録日時</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="e : ${project.expenses}">
				<td th:text="${e.payer.memberName}"></td>
				<td th:text="${#numbers.formatInteger(e.amount, 0)} + ' 円'"></td>
				<td th:text="${e.description}"></td>
				<td th:text="${#temporals.format(e.createdAt, 'yyyy/MM/dd HH:mm')}"></td>
				<td>
					<button class="btn btn-sm btn-warning" data-bs-toggle="modal" data-bs-target="#editExpenseModal"
						th:attr="data-id=${e.id}, data-amount=${e.amount}, data-desc=${e.description}, data-payer=${e.payer.id}">
						編集
					</button>
				</td>
			</tr>
		</tbody>
	</table>
	<hr>

	<!--データ-->
	<h3>支払状況</h3>

	<div class="d-flex justify-content-center">
		<canvas id="paidChart"></canvas>
	</div>
	<script th:inline="javascript">
		const paidLabels = /*[[${paidMap.keySet()}]]*/[];
		const paidValues = /*[[${paidMap.values()}]]*/[];
	</script>


	<a th:href="@{/projects}" class="btn btn-secondary">一覧に戻る</a>

	<a th:href="@{'/projects/' + ${project.id} + '/settlement'}" class="btn btn-success">
		精算
	</a>

	<div th:replace="warimoney/fragments/modals :: addMemberModal"></div>
	<div th:replace="warimoney/fragments/modals :: editMemberModal"></div>
	<div th:replace="warimoney/fragments/modals :: addExpenseModal"></div>
	<div th:replace="warimoney/fragments/modals :: editExpenseModal"></div>


	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
	<script th:src="@{/js/project_detail.js}"></script>
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	<script th:src="@{/js/project_chart.js}"></script>
</body>

</html>
