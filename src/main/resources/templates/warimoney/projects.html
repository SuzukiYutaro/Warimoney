<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>プロジェクト一覧</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/projects.css}">
</head>

<body>
	<div class="projects-page">

		<div class="header">
			<div class="title">
				<div class="page-title">PROJECTS</div>
				<div class="page-subtitle">プロジェクト一覧</div>
			</div>
			<div class="logo">
				<img src="/img/warimoney_logo.png" alt="logo">
			</div>
		</div>

		<div class="projects-board">
			<div class="projects-grid">
				<div class="project-card" th:each="project : ${projects}"
					th:onclick="|location.href='/projects/${project.id}'|">

					<div class="project-name" th:text="${project.projectName}"></div>
					<div class="project-info">
						<div>
							作成日時：<span th:text="${#temporals.format(project.createdAt, 'yyyy.MM/dd')}"></span>
						</div>
						<div class="mt-3">
							更新日時：<span th:text="${#temporals.format(project.updatedAt,'yyyy.MM/dd HH時')}"></span>
						</div>
					</div>
					<button class="btn-edit" onclick="event.stopPropagation()" data-bs-toggle="modal"
						data-bs-target="#editProjectModal"
						th:attr="data-id=${project.id}, data-name=${project.projectName}">
						編集
					</button>
				</div>

				<button class="add-project-card" data-bs-toggle="modal" data-bs-target="#addProjectModal">
					+
				</button>

			</div>

		</div>

		<form th:action="@{/logout}" method="post" class="logout-form">

			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

			<button class="btn btn-danger">
				ログアウト
			</button>

		</form>
	</div>

	<div th:replace="warimoney/fragments/modals :: addProjectModal"></div>
	<div th:replace="warimoney/fragments/modals :: editProjectModal"></div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
	<script th:src="@{/js/projects.js}"></script>

</body>

</html>
